dth:20px;border-radius:6px}.chip.on{outline:4px solid #26233a;transform:scale(.97)}.back{border:0;background:#fff;border-radius:16px;padding:10px 16px;font-size:15px;font-weight:700;color:#5b4bdb;box-shadow:0 2px 6px #0002;margin-bottom:4px}.chip{border:0;border-radius:16px;padding:16px 6px;font-size:18px;color:#fff;font-weight:700}

<div class="top"><h1 onclick="go('home')" style="cursor:pointer">🏠 우빈이가족</h1><div><button class="me" onclick="showGuide()">❓ 사용법</button> <span class="me" id="meb"></span></div></div>

<script>
const DB="https://hyfamily-default-rtdb.asia-southeast1.firebasedatabase.app";
const FAM=["아빠","엄마","우빈"],I={아빠:"👨",엄마:"👩",우빈:"👦"},C={아빠:"#4a7be8",엄마:"#e8618c",우빈:"#f59e0b"};
const GOODQ=["🪥 양치했어요","📚 숙제했어요","🧸 정리했어요","🍚 밥 잘 먹었어요","🤝 도와줬어요","🧑‍🤝‍🧑 친구들과 잘 지냈어요"],BADQ=["😠 화냈어요","📱 게임 오래 했어요","🍬 약속 안 지켰어요","🛏️ 늦게 잤어요","💢 친구들과 다퉜어요","😞 선생님께 혼났어요"];
const MK={아빠:"dad",엄마:"mom",우빈:"son"},RK={dad:"아빠",mom:"엄마",son:"우빈"};
let loaded=false,calY=new Date().getFullYear(),calM=new Date().getMonth(),selDay=null,sel=new Set(),me=null,view="home",data={},last="",offline=false;
try{me=localStorage.getItem("me")}catch(e){}
if(me==="아들")me="우빈";if(me&&!FAM.includes(me))me=null;
const $=id=>document.getElementById(id);
const esc=s=>String(s??"").replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const L=o=>Object.entries(o||{}).map(([id,v])=>({...v,id}));
const fmt=t=>{const d=new Date(t);return (d.getMonth()+1)+"/"+d.getDate()+" "+String(d.getHours()).padStart(2,"0")+":"+String(d.getMinutes()).padStart(2,"0")};
const today=t=>new Date(t).toDateString()===new Date().toDateString();
async function api(m,p,b){const r=await fetch(DB+(p||"/")+".json",{method:m,body:b?JSON.stringify(b):undefined});if(!r.ok)throw new Error(r.status);return r.json()}
async function w(m,p,b){try{await api(m,p,b);document.querySelectorAll("input,textarea").forEach(e=>{if(e.type!=="date")e.value=""});if(document.activeElement)document.activeElement.blur();offline=false;await poll(true);return true}catch(e){alert("저장이 안 됐어요. 인터넷을 확인해 주세요.")}}
function toast(t){const e=$("toast");e.textContent=t;e.style.display="block";setTimeout(()=>e.style.display="none",1800)}
const posts=()=>L(data.posts).sort((a,b)=>b.ts-a.ts);
const bal=p=>L(data.stickers).filter(s=>s.to===p).reduce((a,s)=>a+(s.n||1),0);
const cnt=(f,t)=>posts().filter(p=>p.by===f&&p.type===t&&today(p.ts)).length;
async function poll(force){try{const d=await api("GET","");const s=JSON.stringify(d||{});offline=false;loaded=true;if(s!==last||force){last=s;data=JSON.parse(s.replace(/"아들"/g,'"우빈"'));render()}}catch(e){if(!offline){offline=true;render()}}}
async function hash(p){const t="hyfamily:"+p;try{const b=await crypto.subtle.digest("SHA-256",new TextEncoder().encode(t));return[...new Uint8Array(b)].map(x=>x.toString(16).padStart(2,"0")).join("")}catch(e){let h=5381;for(const c of t)h=((h<<5)+h+c.charCodeAt(0))|0;return"d"+h}}
async function getPw(){return api("GET","/admin/pw")}
async function makePw(){const p=prompt("관리자 비밀번호를 만들어 주세요\n(아빠만 아는 숫자나 글자 4자리 이상)");if(p===null)return false;if(p.length<4){alert("4자리 이상으로 만들어 주세요");return false}
 if(prompt("한 번 더 입력해 주세요")!==p){alert("두 번이 달라요. 처음부터 다시 해주세요");return false}
 try{await api("PUT","/admin/pw",await hash(p));await poll(true);toast("🔑 비밀번호를 만들었어요");return true}catch(e){alert("저장이 안 됐어요. 인터넷을 확인해 주세요");return false}}
async function askPw(){let adm;try{adm=await getPw()}catch(e){alert("인터넷 연결을 확인해 주세요");return null}if(!adm)return"none";const p=prompt("관리자(아빠) 비밀번호를 입력하세요");if(p===null)return null;if(await hash(p)!==adm){alert("비밀번호가 달라요");return null}return"ok"}
async function pick(f){if(!confirm(I[f]+" "+f+" 맞나요?\n\n한 번 정하면 이 폰은 계속 "+f+" 이름으로 쓰여요.\n바꾸려면 관리자(아빠) 비밀번호가 필요해요."))return;
 if(f==="아빠"){const r=await askPw();if(!r)return;if(r==="none"&&!(await makePw()))return}
 setMe(f)}
async function adminReset(){const r=await askPw();if(r==="ok"||(r==="none"&&confirm("관리자 비밀번호가 아직 없어요. 이 폰의 사용자를 바꿀까요?")))setMe(null)}
function adminBanner(){return me==="아빠"&&loaded&&!(data.admin&&data.admin.pw)?`<div class="card" style="text-align:center"><b>🔑 관리자 비밀번호를 만들어 주세요</b><div class="meta">이름 바꾸기는 이 비밀번호로만 할 수 있어요</div><button class="btn" style="margin-top:8px" onclick="makePw()">비밀번호 만들기</button></div>`:""}
function setMe(f){me=f;try{f?localStorage.setItem("me",f):localStorage.removeItem("me")}catch(e){}if(f)view=f==="우빈"?"우빈":"home";render()}
function go(v){view=v;try{history.pushState({v},"")}catch(e){}render();scrollTo(0,0)}
window.onpopstate=e=>{view=(e.state&&e.state.v)||"home";render()};try{history.replaceState({v:"home"},"")}catch(e){}
function tog(k){sel.has(k)?sel.delete(k):sel.add(k);render()}
async function postSel(){const g={good:[],bad:[]};[...sel].forEach(k=>{const i=k.indexOf("|");g[k.slice(0,i)].push(k.slice(i+1))});
 try{let n=0;for(const type of ["good","bad"]){if(!g[type].length)continue;await api("POST","/posts",{type,by:me,text:g[type].join(" · "),ts:Date.now()+n});n++}
  const c=sel.size;sel.clear();await poll(true);toast("🎉 "+c+"개를 한 번에 올렸어요!")}catch(e){alert("저장이 안 됐어요. 인터넷을 확인해 주세요")}}
function card(p){const ss=L(data.stickers).filter(s=>s.post===p.id),gave=!!me&&L(data.stickers).some(s=>s.from===me&&!s.mission&&today(s.ts)),mine=ss.some(s=>s.from===me),sb=ss.map(s=>`<span class="stk" style="background:${C[s.from]}22;color:${C[s.from]}">⭐ ${esc(s.from)}${s.from===me?`<b onclick="delS('${s.id}')" style="margin-left:5px;cursor:pointer">✕</b>`:""}</span>`).join("")+(p.type==="good"&&p.by!==me&&me?(mine?`<button class="sbtn off" onclick="delS('${ss.find(s=>s.from===me).id}')">↩️ 스티커 취소</button>`:gave?`<button class="sbtn off" disabled>⭐ 오늘은 이미 줬어요</button>`:`<button class="sbtn" onclick="giveP('${p.id}')">⭐ 스티커 주기</button>`):"");const lab={good:"😊 잘한일",bad:"😢 아쉬운일",event:"📅 일정",note:"💬 공유"}[p.type]||"";
 const cs=L(p.cm).sort((a,b)=>a.ts-b.ts).map(c=>`<div class="cm"><span class="av" style="background:${C[c.by]}33">${A(c.by)}</span><div class="bub"><b style="color:${C[c.by]}">${esc(c.by)}</b> ${esc(c.t)}${(c.by===me||me==="아빠")?`<button class="del" onclick="delC('${p.id}','${c.id}')">✕</button>`:""}</div></div>`).join("");
 return `<div class="card" style="border-left:6px solid ${C[p.by]||"#999"}"><div class="pt"><span class="av" style="background:${C[p.by]}33">${A(p.by)}</span><div><b>${esc(p.by)}</b><span class="tag t-${p.type}">${lab}</span><div class="meta">${fmt(p.ts)}${p.date?" · 📅 "+esc(p.date):""}${p.edited?" · 수정됨":""}</div></div>${canEdit(p)?`<span style="margin-left:auto;white-space:nowrap"><button class="del" style="margin:0" onclick="editP('${p.id}')">✏️</button><button class="del" style="margin:0 0 0 6px" onclick="delP('${p.id}')">🗑️</button></span>`:""}</div>
 <p class="tx">${esc(p.text)}</p>${sb?`<div class="sr">${sb}</div>`:""}${rxBar(p)}${cs}<div class="row"><input id="c${p.id}" placeholder="💬 댓글 달기" onkeydown="if(event.key==='Enter')addC('${p.id}')"><button class="btn sm" onclick="addC('${p.id}')">보내기</button></div></div>`}
function composer(){const kid=me==="우빈";
 return (kid?`<div class="card"><b>😊 오늘 잘한일 · 😢 아쉬운일</b><div class="meta">여러 개 골라서 한 번에 올릴 수 있어요</div><br><b>😊 잘한일</b><div class="chips">${GOODQ.map(q=>`<button class="chip${sel.has('good|'+q)?' on':''}" style="background:#2fa84f" onclick="tog('good|${q}')">${sel.has('good|'+q)?'✓ ':''}${q}</button>`).join("")}</div><b>😢 아쉬운일</b><div class="chips">${BADQ.map(q=>`<button class="chip${sel.has('bad|'+q)?' on':''}" style="background:#e8874a" onclick="tog('bad|${q}')">${sel.has('bad|'+q)?'✓ ':''}${q}</button>`).join("")}</div>${sel.size?`<button class="btn" style="width:100%;background:#26233a" onclick="postSel()">✅ ${sel.size}개 올리기</button>`:""}</div>`:"")+
 `<div class="card"><b>✍️ ${kid?"내가 직접 쓰기":"오늘 나의 이야기"}</b><select id="ptype"><option value="good">😊 잘한일</option><option value="bad">😢 아쉬운일</option><option value="note">💬 그냥 공유</option></select><textarea id="ptext" rows="2" placeholder="내용을 적어주세요"></textarea><button class="btn" style="background:${C[me]};width:100%" onclick="addP()">올리기</button></div>`}
function person(f){const col=C[f],ps=posts().filter(p=>p.by===f&&p.type!=="event"),sts=L(data.stickers).filter(s=>s.to===f).sort((a,b)=>b.ts-a.ts).slice(0,4);
 let h=`<div class="hero" style="background:linear-gradient(135deg,${col},${col}aa)"><div class="a">${A(f)}</div><div><h2>${f}의 공간</h2><div>⭐ ${bal(f)}개 모음</div><div>오늘 😊 ${cnt(f,"good")} · 😢 ${cnt(f,"bad")}</div>${(f===me||me==="아빠")?`<button class="me" style="margin-top:8px;background:#fff4" onclick="editFace('${f}')">📷 얼굴 바꾸기</button>`:""}</div></div>`;
 if(f===me)h+=composer();
 else h+=`<div class="card" style="text-align:center">⭐ 마음에 드는 <b>잘한일</b> 글에서 스티커를 눌러주세요<div class="meta">하루에 한 번만 줄 수 있어요 · ${L(data.stickers).some(x=>x.from===me&&!x.mission&&today(x.ts))?"오늘은 이미 줬어요 ✓":"오늘 아직 안 줬어요"}</div></div>`;
 if(sts.length)h+=`<h3>⭐ 최근 받은 스티커</h3>`+sts.map(s=>`<div class="card" style="padding:10px 14px">${E(s.from)} <b>${esc(s.from)}</b> → ⭐${s.n||1} · ${esc(s.r)}<span class="meta"> ${fmt(s.ts)}</span>${(s.from===me&&!s.mission)?`<button class="del" onclick="delS('${s.id}')">✕</button>`:""}</div>`).join("");
 if(f==="우빈")h+=missions();
  return h+`<h3>${E(f)} ${f}의 기록</h3>`+(ps.map(card).join("")||`<p class="meta">아직 기록이 없어요</p>`)}
function missionCard(x){const s=x.status||"open",son=me==="우빈";let act="";
 if(s==="open")act=son?`<button class="btn" style="width:100%;margin-top:8px;background:#2fa84f;font-size:19px" onclick="doneM('${x.id}')">✅ 다 했어요!</button>`:`<div class="meta" style="margin-top:6px">우빈이 하는 중이에요</div>`;

function resetP(){if(me!=="아빠")return;if(confirm("글을 모두 지울까요?\n(댓글, 👍👎도 함께 지워져요)\n\n되돌릴 수 없어요."))return w("DELETE","/posts").then(ok=>ok&&toast("📝 글을 모두 지웠어요"))}
async function changePw(){if(me!=="아빠")return;const r=await askPw();if(r==="ok"||r==="none")await makePw()}
function resetS(f){if(me!=="아빠")return;const t=L(data.stickers).filter(x=>!f||x.to===f);if(!t.length)return toast("지울 스티커가 없어요");
 if(!confirm((f||"가족 전체")+"의 스티커 "+t.length+"개를 모두 지울까요?\n\n되돌릴 수 없어요."))return;const o={};t.forEach(x=>o[x.id]=null);return w("PATCH","/stickers",o).then(ok=>ok&&toast("⭐ 초기화했어요"))}
function delP(id){const p=(data.posts||{})[id];if(!p||!canEdit(p))return;if(confirm("이 글을 지울까요?"))return w("DELETE","/posts/"+id)}
function delC(pid,cid){const p=(data.posts||{})[pid],c=p&&(p.cm||{})[cid];if(!c||!(c.by===me||me==="아빠"))return;if(confirm("댓글을 지울까요?"))w("DELETE","/posts/"+pid+"/cm/"+cid)}
async function giveP(id){const p=data.posts[id];if(!p||!me)return;try{const st=await api("GET","/stickers");if(L(st).some(x=>x.from===me&&!x.mission&&today(x.ts)))return toast("오늘은 이미 스티커를 줬어요 ⭐")}catch(e){}
