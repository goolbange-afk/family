function sheetHtml(){return `<div class="shp"><div class="hd2"><span>✏️ 새 이야기</span><button aria-label="닫기" onclick="closeSheet()">✕</button></div>${composer()}</div>`}
function openSheet(){if(!me)return;sheetOpen=true;render()}
function closeSheet(){sheetOpen=false;render()}
function setPT(k){ptv=k;render()}
function setFl(k){fl=k;render()}
function burst(e){for(let i=0;i<14;i++){const s=document.createElement("span");s.className="bu";s.textContent=e||"⭐";s.style.left=(15+Math.random()*70)+"vw";s.style.setProperty("--dx",(Math.random()*90-45)+"px");s.style.animationDelay=(Math.random()*.3)+"s";document.body.appendChild(s);setTimeout(()=>s.remove(),2000)}}
function addP(ev){const t=($("ptext").value||"").trim();if(!t)return;const dt=ev?$("pdate").value:"";w("POST","/posts",{type:ev||ptv,by:me,text:t,date:dt,ts:Date.now()}).then(ok=>{if(!ok)return;if(sheetOpen){sheetOpen=false;render()}if(ev&&dt){calY=+dt.slice(0,4);calM=+dt.slice(5,7)-1;selDay=dt;render()}toast("올렸어요! ✨")})}
function quick(type,t){w("POST","/posts",{type,by:me,text:t,ts:Date.now()}).then(ok=>ok&&toast(type==="good"?"참 잘했어요! 👏":"다음엔 더 잘할 수 있어요 💪"))}
function addC(id){const i=$("c"+id),t=i.value.trim();if(!t)return;w("POST","/posts/"+id+"/cm",{by:me,t,ts:Date.now()})}
const canEdit=p=>!!me&&(p.by===me||me==="아빠");
function rxBar(p){const ents=Object.entries(p.rx||{}),u=ents.filter(e=>e[1]==="up"),d=ents.filter(e=>e[1]==="down"),mine=(p.rx||{})[MK[me]],can=!!me&&p.by!==me;
 const b=(t,e,l)=>(can?`<button class="rb${mine===t?" on":""}" onclick="react('${p.id}','${t}')">`:`<span class="rb">`)+e+" "+l.length+(l.length?" "+l.map(x=>E(RK[x[0]])).join(""):"")+(can?"</button>":"</span>");
 return `<div class="rx">${b("up","👍",u)}${b("down","👎",d)}</div>`}
function react(id,t){if(!me)return;const k=MK[me],cur=((data.posts||{})[id]||{}).rx;return w(cur&&cur[k]===t?"DELETE":"PUT","/posts/"+id+"/rx/"+k,cur&&cur[k]===t?undefined:t)}
function editP(id){const p=(data.posts||{})[id];if(!p||!canEdit(p))return;const t=prompt("글을 수정해요",p.text);if(t===null)return;if(!t.trim())return alert("내용을 비울 수 없어요");if(t.trim()===p.text)return;return w("PATCH","/posts/"+id,{text:t.trim(),edited:Date.now()}).then(ok=>ok&&toast("✏️ 수정했어요"))}
function delS(id){const x=(data.stickers||{})[id];if(!x||!(me==="아빠"||(x.from===me&&!x.mission)))return;if(confirm(x.from===me?"준 스티커를 취소할까요?\n(취소하면 오늘 다시 줄 수 있어요)":"이 스티커를 지울까요?"))return w("DELETE","/stickers/"+id).then(ok=>ok&&toast("↩️ 스티커를 취소했어요"))}
function admin(){if(me!=="아빠")return"";const sts=L(data.stickers).sort((a,b)=>b.ts-a.ts),ms=L(data.missions),ps=L(data.posts),btn=(c,f,t)=>`<button class="btn sm" style="background:${c}" onclick="${f}">${t}</button>`;
 return `<div class="hero" style="background:linear-gradient(135deg,#3b3a4a,#6b6a80)"><div class="a">🛠️</div><div><h2>관리자 창</h2><div>아빠만 볼 수 있어요</div></div></div>
 <div class="card"><b>⭐ 스티커 관리</b>${FAM.map(f=>`<div class="row" style="margin:8px 0"><span style="font-size:18px">${E(f)} ${f} · ⭐ ${bal(f)}개</span><span style="margin-left:auto">${btn("#e04a4a","resetS('"+f+"')","초기화")}</span></div>`).join("")}<div style="margin-top:8px">${btn("#888","resetS('')","가족 전체 초기화")}</div></div>
 <div class="card"><b>🗂️ 최근 스티커</b><div class="meta" style="margin:4px 0">✕를 누르면 그 스티커만 지워져요</div>${sts.slice(0,20).map(x=>`<div class="row" style="margin:6px 0;font-size:14px"><span>${E(x.from)}→${E(x.to)} ⭐${x.n||1} · ${esc(x.r||"")}${x.mission?" (미션)":""}<span class="meta"> ${fmt(x.ts)}</span></span><button class="del" onclick="delS('${x.id}')">✕</button></div>`).join("")||`<p class="meta">스티커가 없어요</p>`}</div>
 <div class="card"><b>🎯 미션 · 📝 글</b><div class="meta" style="margin:4px 0 8px">미션 ${ms.length}개 · 글 ${ps.length}개 (댓글, 반응 포함)</div><div class="row" style="flex-wrap:wrap">${btn("#e04a4a","resetM()","미션 전체 삭제")}${btn("#e04a4a","resetP()","글 전체 삭제")}${btn("#e04a4a","resetCh()","대화 전체 삭제")}${btn("#e04a4a","resetPh()","사진 전체 삭제")}</div></div>
 <div class="card"><b>🔑 관리자 비밀번호</b><div class="meta" style="margin:4px 0 8px">지금 비밀번호를 한 번 확인한 뒤 새 번호로 바꿔요</div>${btn("#5b4bdb","changePw()","비밀번호 바꾸기")}</div>`}
function resetM(){if(me!=="아빠")return;if(confirm("미션을 모두 지울까요?\n\n되돌릴 수 없어요."))return w("DELETE","/missions").then(ok=>ok&&toast("🎯 미션을 모두 지웠어요"))}
function resetP(){if(me!=="아빠")return;if(confirm("글을 모두 지울까요?\n(댓글, 👍👎도 함께 지워져요)\n\n되돌릴 수 없어요."))return w("DELETE","/posts").then(ok=>ok&&toast("📝 글을 모두 지웠어요"))}
async function changePw(){if(me!=="아빠")return;const r=await askPw();if(r==="ok"||r==="none")await makePw()}
function resetS(f){if(me!=="아빠")return;const t=L(data.stickers).filter(x=>!f||x.to===f);if(!t.length)return toast("지울 스티커가 없어요");
 if(!confirm((f||"가족 전체")+"의 스티커 "+t.length+"개를 모두 지울까요?\n\n되돌릴 수 없어요."))return;const o={};t.forEach(x=>o[x.id]=null);return w("PATCH","/stickers",o).then(ok=>ok&&toast("⭐ 초기화했어요"))}
function delP(id){const p=(data.posts||{})[id];if(!p||!canEdit(p))return;if(confirm("이 글을 지울까요?"))return w("DELETE","/posts/"+id)}
function delC(pid,cid){const p=(data.posts||{})[pid],c=p&&(p.cm||{})[cid];if(!c||!(c.by===me||me==="아빠"))return;if(confirm("댓글을 지울까요?"))w("DELETE","/posts/"+pid+"/cm/"+cid)}
async function giveP(id){const p=data.posts[id];if(!p||!me)return;try{const st=await api("GET","/stickers");if(L(st).some(x=>x.from===me&&!x.mission&&today(x.ts)))return toast("오늘은 이미 스티커를 줬어요 ⭐")}catch(e){}
return w("POST","/stickers",{from:me,to:p.by,post:id,r:String(p.text).slice(0,30),n:1,ts:Date.now()}).then(ok=>ok&&(burst("⭐"),toast("⭐ "+p.by+"에게 스티커를 줬어요!")))}
(()=>{const b=document.getElementById("meb");let t;b.onpointerdown=()=>{t=setTimeout(()=>{if(me)adminReset()},2500)};b.onpointerup=b.onpointerleave=b.onpointercancel=()=>clearTimeout(t);b.oncontextmenu=e=>{e.preventDefault()}})();
(()=>{let x0=0,y0=0,ok=false;document.addEventListener("touchstart",e=>{const p=e.touches[0];x0=p.clientX;y0=p.clientY;ok=FAM.includes(view)&&!sheetOpen&&!/INPUT|TEXTAREA/.test(e.target.tagName)},{passive:true});
document.addEventListener("touchend",e=>{if(!ok)return;const p=e.changedTouches[0],dx=p.clientX-x0,dy=p.clientY-y0;if(Math.abs(dx)>80&&Math.abs(dy)<45){const i=FAM.indexOf(view)+(dx<0?1:-1);if(i>=0&&i<FAM.length)go(FAM[i])}},{passive:true})})();
render();poll();setInterval(poll,3000);
if(typeof navigator!=="undefined"&&navigator.serviceWorker)navigator.serviceWorker.register("sw.js").catch(()=>{});
</script></body></html>
